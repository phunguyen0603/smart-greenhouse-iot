version: '3.8'

services:
  mytb:
    restart: always
    image: "thingsboard/tb-postgres:latest"
    ports:
      - "8080:9090"
      - "1883:1883"
      - "5683-5688:5683-5688/udp"
    environment:
      TB_QUEUE_TYPE: in-memory
    volumes:
      - ./tb-data:/data
      - ./tb-logs:/var/log/thingsboard
